[[redirects]]
  from = "/RS/UN-Display.do"
  to = "/log-in/index.html"
  status = 200

[[redirects]]
  from = "/RS/UN-Submit.do"
  to = "/.netlify/functions/submit"
  status = 200
  method = "POST"

[[redirects]]
  from = "/RS/UN-Submit.do"
  to = "/dashboard/"
